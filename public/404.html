<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AIXCO Energy</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var segments = path.split("/").filter(Boolean);
        var repo = segments[0] || "";
        var route = "/" + segments.slice(1).join("/");
        var query = window.location.search ? "&" + window.location.search.slice(1) : "";
        window.location.replace("/" + repo + "/?p=" + encodeURIComponent(route) + query + window.location.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
